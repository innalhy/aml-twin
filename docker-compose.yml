# TwinAML COMP3424 — compose sketch only.
# Not a supported run path. Start the API and the web client from their READMEs.
# Profiles keep `docker compose up` from building or installing anything.
name: twinaml

services:
  api:
    image: python:3.12-slim
    profiles: ["sketch"]
    working_dir: /srv
    volumes:
      - ./backend:/srv
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install -r requirements.txt &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    image: node:22-alpine
    profiles: ["sketch"]
    working_dir: /srv
    volumes:
      - ./frontend:/srv
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
